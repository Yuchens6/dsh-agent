apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh-agent-run-control
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: dsh-agent-run-control }
  template:
    metadata:
      labels: { app.kubernetes.io/name: dsh-agent-run-control }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: run-control
          image: change-me/dsh-agent-run-control:0.1.0
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - secretRef: { name: dsh-agent-run-control-db }
            - secretRef: { name: dsh-agent-run-control-nats }
            - secretRef: { name: dsh-agent-api-run-control }
            - secretRef: { name: dsh-agent-runtime-run-control }
            - secretRef: { name: dsh-agent-run-control-chat }
            - secretRef: { name: dsh-agent-run-control-catalog }
            - secretRef: { name: dsh-agent-run-control-workspace }
            - secretRef: { name: dsh-agent-workspace-run-control }
            - secretRef: { name: dsh-agent-run-control-quota }
            - secretRef: { name: dsh-agent-run-control-audit }
            - secretRef: { name: dsh-agent-run-control-metrics }
          env:
            - { name: RUN_DELIVERY_WORKERS, value: "2" }
            - { name: RUN_MAX_ACTIVE, value: "64" }
            - { name: RUN_USER_ACTIVE, value: "2" }
            - { name: RUN_TENANT_ACTIVE, value: "32" }
            - { name: RUN_AGING_SECONDS, value: "60" }
            - { name: DB_POOL_MAX, value: "10" }
            - { name: DB_MAX_WAITING, value: "64" }
            - { name: CHAT_URL, value: "http://dsh-agent-chat:8080" }
            - { name: CATALOG_URL, value: "http://dsh-agent-catalog:8080" }
            - { name: QUOTA_URL, value: "http://dsh-agent-quota:8080" }
            - { name: AUDIT_URL, value: "http://dsh-agent-audit:8080" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dsh-agent-run-control
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: dsh-agent-run-control }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dsh-agent-run-control-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: dsh-agent-run-control }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: dsh-agent-api }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: dsh-agent-runtime-dsh }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: dsh-agent-workspace }
      ports: [{ protocol: TCP, port: 8080 }]
