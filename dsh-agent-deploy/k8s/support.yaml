{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "dsh-agent-quota"
  },
  "spec": {
    "replicas": 2,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "dsh-agent-quota"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "dsh-agent-quota"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 1000,
          "runAsGroup": 1000,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "quota",
            "image": "change-me/dsh-agent-quota:0.1.0",
            "env": [{ "name": "POINTS_BILLING_ENABLED", "value": "false" }],
            "ports": [
              {
                "name": "http",
                "containerPort": 8080
              }
            ],
            "envFrom": [
              {
                "secretRef": {
                  "name": "dsh-agent-quota-db"
                }
              },
              {
                "secretRef": {
                  "name": "dsh-agent-api-quota"
                }
              },
              {
                "secretRef": {
                  "name": "dsh-agent-run-control-quota"
                }
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "512Mi"
              }
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/health/live",
                "port": "http"
              }
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/health/ready",
                "port": "http"
              }
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "dsh-agent-quota"
  },
  "spec": {
    "selector": {
      "app.kubernetes.io/name": "dsh-agent-quota"
    },
    "ports": [
      {
        "name": "http",
        "port": 8080,
        "targetPort": "http"
      }
    ]
  }
}
---
{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "dsh-agent-quota"
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app.kubernetes.io/name": "dsh-agent-quota"
      }
    },
    "policyTypes": [
      "Ingress"
    ],
    "ingress": [
      {
        "from": [
          {
            "podSelector": {
              "matchLabels": {
                "app.kubernetes.io/name": "dsh-agent-api"
              }
            }
          },
          {
            "podSelector": {
              "matchLabels": {
                "app.kubernetes.io/name": "dsh-agent-run-control"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 8080
          }
        ]
      }
    ]
  }
}
---
