apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh-agent-workspace
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: dsh-agent-workspace }
  template:
    metadata:
      labels: { app.kubernetes.io/name: dsh-agent-workspace }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: workspace
          image: change-me/dsh-agent-workspace:0.1.0
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: dsh-agent-config }
            - secretRef: { name: dsh-agent-workspace-db }
            - secretRef: { name: dsh-agent-api-workspace }
            - secretRef: { name: dsh-agent-chat-workspace }
            - secretRef: { name: dsh-agent-workspace-s3 }
            - secretRef: { name: dsh-agent-run-control-workspace }
            - secretRef: { name: dsh-agent-workspace-run-control }
            - secretRef: { name: dsh-agent-workspace-audit }
            - secretRef: { name: dsh-agent-workspace-metrics }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            timeoutSeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dsh-agent-workspace
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: dsh-agent-workspace }
  ports: [{ name: http, port: 8080, targetPort: http }]
