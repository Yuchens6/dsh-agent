apiVersion: batch/v1
kind: Job
metadata:
  name: dsh-agent-run-control-migrate-v7
  namespace: agent-platform
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: change-me/dsh-agent-run-control:0.1.0
          command: [node, dist/migrate.js]
          envFrom:
            - secretRef: { name: dsh-agent-run-control-db }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
