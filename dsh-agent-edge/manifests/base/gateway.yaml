apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agent-public
  namespace: agent-edge-system
spec:
  gatewayClassName: dsh-agent-edge
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: agent.dev.local
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: agent-public-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              dsh.agent/public-routes: "true"

