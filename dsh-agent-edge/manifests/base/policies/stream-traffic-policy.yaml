apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: agent-stream
  namespace: agent-platform
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agent-stream
  timeout:
    http:
      requestTimeout: 0s
      maxStreamDuration: 0s
      streamIdleTimeout: 90s
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 60
            unit: Minute

