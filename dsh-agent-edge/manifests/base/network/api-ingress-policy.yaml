apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dsh-agent-api-from-edge-only
  namespace: agent-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dsh-agent-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-edge-system
      ports:
        - protocol: TCP
          port: 8080

