apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-stream
  namespace: agent-platform
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agent-public
      namespace: agent-edge-system
      sectionName: https
  hostnames:
    - agent.dev.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /events/v1
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-User-Id
              - X-Tenant-Id
              - X-Role
              - X-Workspace-Id
              - X-Internal-User
              - X-Service-Identity
              - X-Runtime-Session-Id
            add:
              - name: X-Edge-Route
                value: agent-stream
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: no-referrer
              - name: Permissions-Policy
                value: camera=(), microphone=(), geolocation=()
              - name: Cache-Control
                value: no-store
      backendRefs:
        - group: ""
          kind: Service
          name: dsh-agent-stream
          port: 8080
